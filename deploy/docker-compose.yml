services:
  database:
    image: postgres:16-alpine
    container_name: database
    env_file:
      - ../database/config/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sfc-data-network
    restart: unless-stopped

  backend:
    build:
      context: ../backend
      dockerfile: ../backend/deploy/Dockerfile
    container_name: web-services
    env_file:
      - ../backend/config/.env
    volumes:
      - ../backend:/app
      - nuget-cache:/root/.nuget/packages
      - api-obj:/app/src/web-services.Api/obj
      - api-bin:/app/src/web-services.Api/bin
      - services-obj:/app/src/web-services.Application/obj
      - services-bin:/app/src/web-services.Application/bin
      - repository-obj:/app/src/web-services.Infrastructure/obj
      - repository-bin:/app/src/web-services.Infrastructure/bin
    networks:
      - sfc-internal-network
      - sfc-data-network
    depends_on:
      - database
    restart: unless-stopped

  payment-gateway:
    image: nginx:1.27-alpine
    container_name: payment-gateway
    networks:
      - sfc-internal-network
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: ../frontend/deploy/Dockerfile
    container_name: web-app
    volumes:
      - ../frontend:/app
      - /app/node_modules
    networks:
      - sfc-internal-network
    restart: unless-stopped

  proxy:
    container_name: proxy
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - ../proxy/config/.env
    volumes:
      - ../proxy/config/nginx.conf:/etc/nginx/templates/default.conf.template:ro
      - ../proxy/public/proxy.crt:/etc/nginx/certs/proxy.crt:ro
      - ../proxy/secrets/proxy.key:/etc/nginx/certs/proxy.key:ro
    networks:
      - sfc-internal-network
    restart: unless-stopped

  database-client:
    image: dpage/pgadmin4:latest
    container_name: database-client
    env_file:
      - ../database-client/config/.env
    ports:
      - "81:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - sfc-data-network
    depends_on:
      - database
    restart: unless-stopped
    profiles:
      - dev

volumes:
  postgres_data:
  pgadmin_data:
  nuget-cache:
  api-obj:
  api-bin:
  services-obj:
  services-bin:
  repository-obj:
  repository-bin:
  
networks:
  sfc-internal-network:
    driver: bridge
  sfc-data-network:
    driver: bridge