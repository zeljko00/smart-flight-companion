services:
  database:
    image: postgres:16-alpine
    container_name: database
    env_file:
      - ../database/config/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../database/scripts/:/scripts:ro
    networks:
      - sfc-data-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$APP_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  cache:
    image: redis:7-alpine
    container_name: cache
    volumes:
      - redis_data:/data
    networks:
      - sfc-data-network
    restart: unless-stopped

  storage:
    image: chainguard/minio:latest
    container_name: storage
    command: server /data --console-address ":9001"
    env_file:
      - ../storage/config/.env
    ports:
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - sfc-internal-network
    restart: unless-stopped

  backend:
    build:
      context: ../backend
      dockerfile: ../backend/deploy/Dockerfile
    container_name: web-services
    env_file:
      - ../backend/config/.env
    volumes:
      - ../backend:/app
      - nuget-cache:/root/.nuget/packages
      - api-obj:/app/src/web-services.Api/obj
      - api-bin:/app/src/web-services.Api/bin
      - services-obj:/app/src/web-services.Application/obj
      - services-bin:/app/src/web-services.Application/bin
      - repository-obj:/app/src/web-services.Infrastructure/obj
      - repository-bin:/app/src/web-services.Infrastructure/bin
    networks:
      - sfc-internal-network
      - sfc-data-network
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_started
      storage:
        condition: service_started
    restart: unless-stopped

  database-migrate:
    build:
      context: ../backend
      dockerfile: ../backend/deploy/Dockerfile
    container_name: database-migrate
    env_file:
      - ../backend/config/.env
    volumes:
      - ../backend:/app
      - nuget-cache:/root/.nuget/packages
      - api-obj:/app/src/web-services.Api/obj
      - api-bin:/app/src/web-services.Api/bin
      - services-obj:/app/src/web-services.Application/obj
      - services-bin:/app/src/web-services.Application/bin
      - repository-obj:/app/src/web-services.Infrastructure/obj
      - repository-bin:/app/src/web-services.Infrastructure/bin
    networks:
      - sfc-data-network
    depends_on:
      database:
        condition: service_healthy
    command:
      - bash
      - -lc
      - dotnet ef database update --project src/web-services.Infrastructure/web-services.Infrastructure.csproj --startup-project src/web-services.Api/web-services.Api.csproj
    restart: "no"
    profiles:
      - migrate
      - init

  database-init:
    image: postgres:16-alpine
    container_name: database-init
    env_file:
      - ../database/config/.env
    volumes:
      - ../database/scripts/:/scripts:ro
    networks:
      - sfc-data-network
    depends_on:
      database:
        condition: service_healthy
      backend-migrate:
        condition: service_completed_successfully
    command:
      - sh
      - -lc
      - PGPASSWORD="$$POSTGRES_PASSWORD" psql -h database -U "$$POSTGRES_USER" -d "$$APP_DB" -v ON_ERROR_STOP=1 -f /scripts/01_init_database.sql
    restart: "no"
    profiles:
      - init

  payment-service:
    build:
      context: ../payment-gateway
      dockerfile: ../payment-gateway/deploy/Dockerfile
    container_name: payment-service
    env_file:
      - ../payment-gateway/config/.env
    volumes:
      - ../payment-gateway:/app
      - payment-nuget-cache:/root/.nuget/packages
      - payment-api-obj:/app/src/PaymentGateway.Api/obj
      - payment-api-bin:/app/src/PaymentGateway.Api/bin
      - payment-services-obj:/app/src/PaymentGateway.Application/obj
      - payment-services-bin:/app/src/PaymentGateway.Application/bin
      - payment-repository-obj:/app/src/PaymentGateway.Infrastructure/obj
      - payment-repository-bin:/app/src/PaymentGateway.Infrastructure/bin
      - internal-database:/app/src/PaymentGateway.Api/database
    networks:
      - sfc-internal-network
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: ../frontend/deploy/Dockerfile
    container_name: web-app
    volumes:
      - ../frontend:/app
      - /app/node_modules
    networks:
      - sfc-internal-network
    depends_on:
      - backend
    restart: unless-stopped

  proxy:
    container_name: proxy
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - ../proxy/config/.env
    volumes:
      - ../proxy/config/nginx.conf:/etc/nginx/templates/default.conf.template:ro
      - ../proxy/public/proxy.crt:/etc/nginx/certs/proxy.crt:ro
      - ../proxy/secrets/proxy.key:/etc/nginx/certs/proxy.key:ro
    networks:
      - sfc-internal-network
    restart: unless-stopped

  database-client:
    image: dpage/pgadmin4:latest
    container_name: database-client
    env_file:
      - ../database-client/config/.env
    ports:
      - "81:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - sfc-data-network
    depends_on:
      - database
    restart: unless-stopped
    profiles:
      - dev

volumes:
  postgres_data:
  redis_data:
  minio_data:
  pgadmin_data:
  nuget-cache:
  api-obj:
  api-bin:
  services-obj:
  services-bin:
  repository-obj:
  repository-bin:
  payment-nuget-cache:
  payment-api-obj:
  payment-api-bin:
  payment-services-obj:
  payment-services-bin:
  payment-repository-obj:
  payment-repository-bin:
  internal-database:
  
networks:
  sfc-internal-network:
    driver: bridge
  sfc-data-network:
    driver: bridge